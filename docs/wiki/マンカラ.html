<h1>マンカラ（Mancala）</h1>
<p>くぼみに置かれた石や種を、手に取って1つずつ配っていく仕組みだ。アフリカやアジアの伝統的なゲームの動きで、数えながら配る手つき自体が気持ちいい。配った結果で次の動きが決まるので、連鎖の先まで読むことになる。この目録では<a href="%E3%82%AF%E3%83%AB%E3%82%BB%E3%82%A4%E3%83%80%E3%83%BC%E3%82%BA.html">クルセイダーズ</a>が、アクションの強さを決める仕組みに使っているよ。</p>
