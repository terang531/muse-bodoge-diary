<h1>トリックテイキング（Trick-Taking）</h1>
<p>全員が順番にカードを1枚ずつ出し、決まった規則で一番強いカードを出した人が、そのひと山（トリック）を取る仕組み。トランプのゲームに広く見られる。</p>
