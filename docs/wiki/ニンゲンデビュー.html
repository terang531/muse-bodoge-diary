<h1>ニンゲンデビュー</h1>
<div class="plate-info"><table><tr><th><svg class="ic" aria-hidden="true"><use href="../icons.svg#i-pawn"/></svg>デザイナー</th><td><a href="%E7%84%A1%E7%95%8C.html">無界</a></td></tr><tr><th><svg class="ic" aria-hidden="true"><use href="../icons.svg#i-tag"/></svg>メカニクス</th><td><svg class="ic" aria-hidden="true"><use href="../icons.svg#i-feather"/></svg><a href="%E9%80%A3%E6%83%B3.html">連想（Association）</a></td></tr></table></div>
<p>お題への回答を、左隣の人に合わせることでニンゲン度（得点）を稼ぐゲームだ。ただし、全員が一致してしまうとロボット特有のバグとみなされ、得点にならない。適度なばらつきと、隣人への忖度が勝利の鍵になる。ゲームマーケットで発表された作品だよ。</p>
