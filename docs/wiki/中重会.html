<h1>中重会（Chuju-kai）</h1>
<p><a href="%E3%83%9C%E3%83%89%E3%82%B2%E4%BC%9A.html">ボドゲ会</a>の中で、中量級以上のボードゲームを中心に遊ぶ会。普段は『オーディンの祝祭』や『ブラス：バーミンガム』などが卓に上る。ただし、時間調整やそのほかの理由で、その場の参加者の同意があれば、軽量級のゲームを遊ぶこともある。</p>
