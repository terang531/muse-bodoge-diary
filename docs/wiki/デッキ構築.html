<h1>デッキ構築（Deck Building）</h1>
<p>遊びながら、自分のカードの山にカードを加えていく仕組みだ。最初は弱い山が、少しずつ自分の色に育っていく。何を入れるかだけでなく、何を入れないか、どう捨てるかも腕の見せどころだ。山の成長と、盤面の展開が連動するゲームも多い。この目録では<a href="%E3%83%A2%E3%83%B3%E3%83%90%E3%82%B5.html">モンバサ</a>と<a href="%E3%82%A2%E3%83%AB%E3%82%BF%E3%82%A4.html">アルタイ</a>がそうだね。</p>
